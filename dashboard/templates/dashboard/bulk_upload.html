{% extends 'base.html' %}

{% block content %}

    <div class="card">

        <div class="card-body">

            <h3>
                آپلود گروهی آهنگ
            </h3>

            {% if messages %}
                <div class="mt-3">
                    {% for message in messages %}
                        <div class="alert alert-{% if message.tags == 'error' %}danger{% elif message.tags == 'warning' %}warning{% else %}success{% endif %}">
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}

            <form method="post" enctype="multipart/form-data" class="mt-3">

                {% csrf_token %}

                <div class="mb-3">

                    <label>
                        فایل‌های mp3
                    </label>

                    <div class="mb-3">
                        <label>ژانر</label>
                        <select name="genre" class="form-select">
                            <option value="auto">✨ استخراج خودکار از متاداده فایل</option>
                            {% for genre in genres %}
                                <option value="{{ genre.id }}">
                                    {{ genre.name }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3 form-check">
                        <input type="checkbox" name="create_album" class="form-check-input" id="createAlbumCheck" checked>
                        <label class="form-check-label" for="createAlbumCheck">
                            💿 ایجاد آلبوم به صورت خودکار (در صورت وجود در متاداده)
                        </label>
                    </div>

                    <div class="mb-3 form-check p-3 bg-light rounded border border-warning" id="ignoreGenreBlock">
                        <input type="checkbox" name="ignore_unknown_genre" class="form-check-input" id="ignoreGenreCheck">
                        <label class="form-check-label text-warning fw-bold" for="ignoreGenreCheck">
                            ⚠️ آهنگ‌ها حتی در صورت نداشتن ژانر (Unknown) آپلود شوند.
                        </label>
                    </div>

                    <input type="file" name="musics" multiple accept=".mp3" class="form-control">

                </div>

                <div class="mb-3">

                    <label>
                        کاورها
                    </label>

                    <input type="file" name="covers" multiple accept=".jpg,.jpeg,.png" class="form-control">

                </div>

                <button class="btn btn-warning">
                    آپلود
                </button>

            </form>

        </div>

    </div>

{% endblock %}
