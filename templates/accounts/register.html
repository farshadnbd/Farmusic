{% extends 'base.html' %}
{% block title %}ثبت نام کاربران{% endblock %}

{% block content %}
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card auth-premium-card p-4 p-md-5 rounded-4 shadow-lg text-center">
                    <div class="pt-2 pb-3 border-bottom border-light">
                        <span class="text-white">حساب کاربری دارید ؟</span>
                        <a href="{% url 'login' %}?next={{ next }}" class="text-warning small text-decoration-none ms-1">
                            ورود
                        </a>
                    </div>
                    <h2 class="text-white fw-bold mb-4 mt-3">👤 عضویت سریع در سایت</h2>
                    <form method="post" class="premium-form text-start text-light mb-3">
                        {% csrf_token %}
                        <!-- 👈 نگه داشتن پارامتر next برای هدایت بعد از ثبت‌نام -->
                        <input type="hidden" name="next" value="{{ next }}">

                        {{ form.as_p }}
                        <button type="submit" class="btn btn-warning w-100 fw-bold py-2.5 rounded-pill shadow-sm mt-3">
                            ✨ تکمیل ثبت نام و عضویت
                        </button>
                    </form>
                </div>

            </div>
        </div>
    </div>
{% endblock %}
