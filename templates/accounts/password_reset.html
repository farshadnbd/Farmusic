{% extends 'base.html' %}

{% block title %}بازنشانی رمز عبور{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card auth-premium-card p-4 p-md-5 rounded-4 shadow-lg text-center">
                <h3 class="mb-3 text-white fw-bold">🔑 بازنشانی رمز عبور</h3>
                <p class="text-secondary small lh-base mb-4">
                    لطفاً آدرس ایمیل خود را وارد کنید تا لینک بازنشانی و تغییر رمز عبور برای شما ارسال شود.
                </p>

                <form method="post" class="premium-form text-start text-light">
                    {% csrf_token %}

                    <div class="mb-4">
                        {{ form.as_p }}
                    </div>

                    <button type="submit" class="btn btn-warning w-100 fw-bold py-2.5 rounded-pill shadow-sm">
                        ✉️ ارسال ایمیل بازیابی
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
