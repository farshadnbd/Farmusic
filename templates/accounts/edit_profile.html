{% extends 'base.html' %}

{% block title %}ویرایش پروفایل{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card auth-premium-card p-4 p-md-5 rounded-4 shadow-lg">
                <h3 class="mb-4 text-white fw-bold">✏️ ویرایش پروفایل کاربری</h3>

                <div class="d-flex flex-wrap gap-2 mb-4 pb-4 border-bottom border-secondary">
                    <a href="{% url 'change_password' %}" class="btn btn-outline-warning rounded-pill btn-sm">
                        🔒 تغییر رمز عبور
                    </a>
                    <a href="{% url 'delete_account' %}" class="btn btn-outline-danger rounded-pill btn-sm">
                        🗑 حذف حساب کاربری
                    </a>
                </div>

                <form method="post" enctype="multipart/form-data" class="premium-form">
                    {% csrf_token %}

                    <div class="form-fields-wrapper text-light mb-4">
                        {{ form.as_p }}
                    </div>

                    <button type="submit" class="btn btn-warning w-100 fw-bold py-2.5 rounded-pill shadow-sm mt-2">
                        💾 ذخیره تغییرات جدید
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
