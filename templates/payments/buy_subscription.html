{% extends 'base.html' %}

{% block content %}
    <div class="container mt-5">
        <h2 class="mb-4 text-center">خرید اشتراک VIP</h2>
        <div class="row">
            {% for plan in plans %}
                <div class="col-md-4 mb-4">
                    <div class="card h-100 shadow text-center">
                        <div class="card-body">
                            <h4>{{ plan.title }}</h4>
                            <hr>
                            <h3 class="text-success">{{ plan.price }} تومان</h3>
                            <p>مدت اعتبار: {{ plan.duration_days }} روز</p>

                            <div class="d-grid gap-2 mt-3">
                                <a href="{% url 'create_payment' plan.id %}?gateway=zarinpal" class="btn btn-warning fw-bold">
                                    پرداخت با زرین‌پال
                                </a>
                                <a href="{% url 'create_payment' plan.id %}?gateway=bitpay" class="btn btn-primary fw-bold">
                                    پرداخت با بیت‌پی
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>
{% endblock %}
